[[mods]]
modId="wayfarers"
version="${mod_version}"
displayName="Wayfarers"
logoFile="logo.png"
authors="Wayfarers Guild"
description='''Exploration-first co-op survival with a cyber-steampunk soul.
45 hand-built structures in every dimension, including ten colossal Wonders (Clockwork Citadel, Undercity,
Sky Isles, Deep Dwarven City, Crystal Cathedral...), Elden Ring style bosses, automatons and a Brass Golem
companion, a toggleable Overworld overhaul with 52 biomes (terrain inspired by Terralith, MIT), simple magic and a talent tree, simple machines,
steam gadgets (grappling hook, glider, wrench...), building tools, storage and quality-of-life galore,
an illustrated in-game Manual and a shared quest line.'''

