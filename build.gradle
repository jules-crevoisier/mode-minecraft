// Wayfarers — Minecraft 26.2 / Forge 65.1.0 (Java 25)
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

// Versions (docs/PUBLISHING.md): a release (CI on a v* tag passes -Prelease=true) is mod_version itself; any other build
// carries its build number as semantic-versioning build metadata, 0.9.0-beta+build.84 (CI: -Pbuild_number=<run>).
// The jar name swaps '+' for '-' (wayfarers-0.9.0-beta-build.84.jar): '+' is unsafe in download links.
def wayfarersRelease = providers.gradleProperty('release').getOrElse('false') == 'true'
def wayfarersBuild = providers.gradleProperty('build_number').getOrElse('local')
def wayfarersVersion = wayfarersRelease ? project.mod_version : "${project.mod_version}+build.${wayfarersBuild}".toString()
version = wayfarersVersion
group = 'com.wayfarers'
base.archivesName = 'wayfarers'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// CI client test (tools/ci_client.py): `./gradlew runClient -Pwayfarers.ci=true` turns on the scripted screenshot run
def wayfarersCi = providers.gradleProperty('wayfarers.ci').getOrElse('false') == 'true'
def wayfarersCiTimeout = providers.gradleProperty('wayfarers.ci.timeout').getOrElse('1080')

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'wayfarers'
        }
        register('client') {
            // client/CiDriver plays its scripted tour, in a 1280x720 OpenGL window (see tools/ci_client.py)
            if (wayfarersCi) {
                systemProperty 'wayfarers.ci', 'true'
                systemProperty 'wayfarers.ci.timeout', wayfarersCiTimeout
                args '--width', '1280', '--height', '720', '--graphicsBackend', 'opengl'
            }
        }
        register('server') {
            args '--nogui'
        }
        register('gameTestServer')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: wayfarersVersion, network_protocol: project.network_protocol,
                 mod_download_url: project.mod_download_url]
    inputs.properties(props)
    filesMatching(['META-INF/mods.toml', 'META-INF/wayfarers/build.properties']) {
        expand(props)
    }
    // registry ids, with the aliases of renamed ones, for release/RegistryRemap (checked by tools/validate.py)
    from(layout.projectDirectory.file('tools/data/registry_ids.json')) {
        into 'META-INF/wayfarers'
    }
}

tasks.withType(Jar).configureEach {
    archiveVersion = wayfarersVersion.replace('+', '-')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
