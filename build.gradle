// Brasshaven — Minecraft 26.2 / Forge 65.1.0 (Java 25)
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

// Versions (docs/PUBLISHING.md): a release (CI on a v* tag passes -Prelease=true) is mod_version itself; any other build
// carries its build number as semantic-versioning build metadata, 0.9.0-beta+build.84 (CI: -Pbuild_number=<run>).
// The jar name swaps '+' for '-' (brasshaven-0.9.0-beta-build.84.jar): '+' is unsafe in download links.
def brasshavenRelease = providers.gradleProperty('release').getOrElse('false') == 'true'
def brasshavenBuild = providers.gradleProperty('build_number').getOrElse('local')
def brasshavenVersion = brasshavenRelease ? project.mod_version : "${project.mod_version}+build.${brasshavenBuild}".toString()
version = brasshavenVersion
group = 'com.brasshaven'
base.archivesName = 'brasshaven'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// CI client test (tools/ci_client.py): `./gradlew runClient -Pbrasshaven.ci=true` turns on the scripted screenshot run
def brasshavenCi = providers.gradleProperty('brasshaven.ci').getOrElse('false') == 'true'
def brasshavenCiTimeout = providers.gradleProperty('brasshaven.ci.timeout').getOrElse('1080')
// showcase job (tools/ci_client.py --showcase): the filmed tour of client/CiShowcase instead of the test, window size WxH
def brasshavenShowcase = providers.gradleProperty('brasshaven.showcase').getOrElse('false') == 'true'
def brasshavenShowcaseSlowmo = providers.gradleProperty('brasshaven.showcase.slowmo').getOrElse('0')
def brasshavenCiSize = providers.gradleProperty('brasshaven.ci.size').getOrElse('1280x720').split('x')

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'brasshaven'
        }
        register('client') {
            // client/CiDriver plays its scripted tour, in a 1280x720 OpenGL window (see tools/ci_client.py)
            if (brasshavenCi) {
                systemProperty 'brasshaven.ci', 'true'
                systemProperty 'brasshaven.ci.timeout', brasshavenCiTimeout
                if (brasshavenShowcase) {
                    systemProperty 'brasshaven.showcase', 'true'
                    systemProperty 'brasshaven.showcase.slowmo', brasshavenShowcaseSlowmo
                }
                args '--width', brasshavenCiSize[0], '--height', brasshavenCiSize[1], '--graphicsBackend', 'opengl'
            }
        }
        register('server') {
            args '--nogui'
        }
        register('gameTestServer')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: brasshavenVersion, network_protocol: project.network_protocol,
                 mod_download_url: project.mod_download_url]
    inputs.properties(props)
    filesMatching(['META-INF/mods.toml', 'META-INF/brasshaven/build.properties']) {
        expand(props)
    }
    // registry ids, with the aliases of renamed ones, for release/RegistryRemap (checked by tools/validate.py)
    from(layout.projectDirectory.file('tools/data/registry_ids.json')) {
        into 'META-INF/brasshaven'
    }
}

tasks.withType(Jar).configureEach {
    archiveVersion = brasshavenVersion.replace('+', '-')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
