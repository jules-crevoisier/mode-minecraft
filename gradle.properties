org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=26.2
forge_version=65.1.0
eventbus_version=7.0.5
# Release being prepared (docs/PUBLISHING.md). A tagged release v<mod_version> is exactly this version; every other
# build is <mod_version>+build.<CI run number> (+build.local on your machine). Bump it right after a release.
mod_version=0.9.4-beta
# Network protocol of the mod's channel: bump it only when a network message is added, removed or re-encoded.
network_protocol=3
# Download page shown to players refused for a version mismatch (the CurseForge page once the project exists).
mod_download_url=https://github.com/jules-crevoisier/mode-minecraft/releases
