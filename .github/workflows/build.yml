name: Build the mod

on:
  push:
  # "Run workflow" with release ticked publishes v<mod_version> from the chosen branch, like pushing that tag
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release v<mod_version> (gradle.properties) from this commit"
        type: boolean
        default: false

permissions:
  contents: write

# one build per branch at a time: a new push cancels the running build, so the latest code is always the one tested
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Versions (docs/PUBLISHING.md): a v<mod_version> tag builds the release itself, any other push a development
      # build <mod_version>+build.<run number> (jar brasshaven-<mod_version>-build.<run>.jar)
      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.release }}" = true ]; then
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "GRADLE_VERSION_ARGS=-Prelease=true" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$base in gradle.properties"
              exit 1
            fi
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "GRADLE_VERSION_ARGS=-Prelease=true" >> "$GITHUB_ENV"
          else
            echo "version=$base+build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "GRADLE_VERSION_ARGS=-Pbuild_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      # an id that disappears breaks the worlds that hold it: it needs an alias or a "removed" entry
      - name: World compatibility (registry ids, tools/data/registry_ids.json)
        run: python3 tools/validate.py --registry-ids

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace $GRADLE_VERSION_ARGS

      - name: Upload the jar (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: brasshaven-mod
          path: build/libs/brasshaven-*.jar

      - name: Server pack and modpack
        run: |
          jar=$(ls build/libs/brasshaven-*.jar | grep -v -- '-sources\.jar$' | head -n 1)
          python3 tools/make_modpack.py serverpack --jar "$jar" --out build/packs
          python3 tools/make_modpack.py modpack --jar "$jar" --out build/packs

      # an unknown or removed flag would stop the players' server from starting
      - name: Check the server pack's JVM flags on Java 25
        run: java @serverpack/jvm_args.txt -Xms256M -Xmx256M -XX:-AlwaysPreTouch -version

      - name: Upload the packs (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: brasshaven-packs
          path: build/packs/*.zip

  # Boots a real Forge server with the jar, places every structure, summons every mob and item,
  # breaks blocks, spawns every loot table and reloads data packs. Fails on any error in the log.
  # the two server tests run side by side on separate machines
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-mod
          path: jar

      - name: Install the Forge server
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-installer.jar
          java -jar installer.jar --installServer server > install.log 2>&1 || (tail -50 install.log; exit 1)
          cp jar/brasshaven-*.jar server/mods/

      - name: Run the smoke test (structures, mobs, items, loot)
        run: python3 tools/ci_smoke.py server

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console*.log

      # the diagnostic summary (phases, FAIL lines) and the profile of the crowded base go to the previews release
      - name: Upload the test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-previews-smoke
          if-no-files-found: ignore
          path: server/brasshaven-ci-*.txt

      # the Java Flight Recorder recording of the server performance check (open it in JDK Mission Control, or
      # python3 tools/jfr_report.py brasshaven-ci-mspt.jfr)
      - name: Upload the JFR recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfr-smoke
          if-no-files-found: ignore
          path: server/*.jfr

  # The structure fit test, in a fresh world with Minecraft's own terrain (and the Brasshaven biomes, on by default), in two
  # shards on two machines (every second structure each): /brasshaven fitcheck locates the Overworld structures of the
  # mod, generates them and measures how they sit on the vanilla terrain (floating edges, buried edges, flooding),
  # with a render of each in place. A misfit fails the job. Each shard keeps to ~35 minutes of test.
  fit-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: fit-1
            shard: "0/2"
          - part: fit-2
            shard: "1/2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-mod
          path: jar

      - name: Install the Forge server
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-installer.jar
          java -jar installer.jar --installServer server > install.log 2>&1 || (tail -50 install.log; exit 1)
          cp jar/brasshaven-*.jar server/mods/

      - name: Run the structure fit test (every Overworld structure located, generated and measured in a vanilla world)
        run: python3 tools/ci_smoke.py server --fit --shard ${{ matrix.shard }}

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fit-test-logs-${{ matrix.part }}
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console*.log

      - name: Upload the fit renders and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-previews-${{ matrix.part }}
          if-no-files-found: ignore
          path: |
            server/brasshaven-fit-*.png
            server/brasshaven-fit*.txt
            server/brasshaven-ci-*.txt

  # The Brasshaven biomes and the generation speed gate, on one machine: the server runs twice on the same seed in a
  # fresh normal world, WITH the Brasshaven biomes and terrain touches (config world.customBiomes / world.terrain.*)
  # and WITHOUT (vanilla generation). Each run really generates the same fresh areas (/brasshaven genbench area: a
  # fixed 12 x 12 chunk area at 20000 20000 and a 6 x 6 area on each Brasshaven biome); the job fails when WITH is
  # more than 5 % slower per chunk than WITHOUT (a pair over the gate is measured again, in the other order). The
  # WITH run also finds each biome with /locate biome and draws it (/brasshaven biomeshots).
  # Then the whole mod against vanilla: the same Forge server with and without the Brasshaven jar, same seed, the same
  # fresh areas generated with /forceload (start time, ms and CPU per chunk per thread, heap after GC, MSPT with the
  # areas loaded; reported, not gated), each recorded with Java Flight Recorder (brasshaven-ci-profile-gen.txt).
  world-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-mod
          path: jar

      - name: Install the Forge server
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-installer.jar
          java -jar installer.jar --installServer server > install.log 2>&1 || (tail -50 install.log; exit 1)
          cp jar/brasshaven-*.jar server/mods/

      - name: Run the world test (Brasshaven biomes, generation speed with / without, biome renders)
        run: python3 tools/ci_smoke.py server --world

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-test-logs
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console*.log

      # the summary (with the speed ratio), the genbench lines and the biome renders go to the previews release
      - name: Upload the biome renders and the speed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-previews-world
          if-no-files-found: ignore
          path: |
            server/brasshaven-biome-*.png
            server/brasshaven-biomes.txt
            server/brasshaven-genbench.txt
            server/brasshaven-ci-*.txt

      # the generation profiles of the full mod and of vanilla (python3 tools/jfr_report.py <file> summarises one)
      - name: Upload the JFR recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfr-world
          if-no-files-found: ignore
          path: server/*.jfr

  # Runs the real client (software OpenGL under Xvfb) through ForgeGradle's runClient. client/CiDriver creates a
  # world, opens every screen of the mod, places machines, summons creatures and the Clockwork Citadel, and saves a
  # screenshot of each; tools/ci_client.py enforces the timeouts and fails on client-side errors in the log.
  # `release` does not wait for it: the jar still ships while this job beds in.
  client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      MESA_GL_VERSION_OVERRIDE: "4.5"
      MESA_GLSL_VERSION_OVERRIDE: "450"
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb and Mesa (software OpenGL)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri \
            libegl1 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1
          xvfb-run -a -s "-screen 0 1920x1080x24" glxinfo -B || true

      - name: Run the client test (screens, HUD, creatures, Clockwork Citadel)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/ci_client.py

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          if-no-files-found: ignore
          path: build/ci-client/

      - name: Upload the client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-logs
          if-no-files-found: ignore
          path: |
            run/logs/
            run/crash-reports/
            run/hs_err_pid*.log
            run/ci-client-report.txt
            run/ci-client-console.log

  # Films the mod for the presentation videos (tools/make_video.py): the real client under Xvfb at 1280x720, recorded
  # with ffmpeg x11grab while client/CiShowcase plays a scripted tour in French (structures orbited by the camera, the
  # screens used with a cursor, machines at work, creatures and a boss with their health bars, the biomes from the air,
  # the multiplayer screens). Software rendering is slow, so each scene is filmed in slow motion (/tick rate) and sped
  # up again when it is cut: one clip per scene, brasshaven-showcase-<scene>.mp4, with brasshaven-showcase-scenes.json
  # (durations, cursor tracks). Branch pushes only; nothing waits for it.
  showcase:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      MESA_GL_VERSION_OVERRIDE: "4.5"
      MESA_GLSL_VERSION_OVERRIDE: "450"
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb, Mesa (software OpenGL) and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri \
            libegl1 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          nproc

      # ci_client.py starts Xvfb at the window size, records it and cuts the clips into build/ci-client/showcase/
      - name: Film the showcase tour
        run: python3 tools/ci_client.py --showcase --size 1280x720

      - name: Upload the clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-clips
          if-no-files-found: ignore
          path: |
            build/ci-client/showcase/brasshaven-showcase-*
            build/ci-client/showcase/showcase-summary.md

      - name: Upload the showcase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-logs
          if-no-files-found: ignore
          path: |
            run/logs/
            run/crash-reports/
            run/showcase/scenes.json
            run/showcase/ffmpeg-x11grab.log
            run/ci-client-report.txt
            run/ci-client-console.log

  previews:
    # the structure fit renders, the test summaries, the client screenshots and the showcase clips go to their own
    # pre-release, even when a test failed, so they can be looked at
    needs: [smoke-test, fit-test, world-test, client-test, showcase]
    if: ${{ always() && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: world-previews-*
          merge-multiple: true
          path: previews

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-screenshots
          path: client

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: showcase-clips
          path: showcase

      - name: Collect the client screenshots
        run: |
          mkdir -p previews
          cp client/brasshaven-shot-*.png previews/ 2>/dev/null || echo "no client screenshots"
          cp showcase/brasshaven-showcase-* previews/ 2>/dev/null || echo "no showcase clips"
          cp client/ci-client-summary.md previews/ 2>/dev/null || echo "no client summary"
          # the fit test runs in shards: one report for the release, as before
          if ls previews/brasshaven-fit-shard*.txt >/dev/null 2>&1; then
            cat previews/brasshaven-fit-shard*.txt > previews/brasshaven-fit.txt
          fi
          # the profiles of the smoke test (crowded base) and of the world test (generation, mod and vanilla): one file
          if ls previews/brasshaven-ci-profile-*.txt >/dev/null 2>&1; then
            cat previews/brasshaven-ci-profile-gen.txt previews/brasshaven-ci-profile-mspt.txt > previews/brasshaven-ci-profile.txt 2>/dev/null || true
          fi
          ls previews/brasshaven-ci-*.txt 2>/dev/null || echo "no test summaries"

      - name: Publish the previews
        if: hashFiles('previews/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: previews-${{ github.ref_name }}
          name: Brasshaven — aperçus (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: Chaque structure en place sur le relief de Minecraft avec sa mesure d'intégration (brasshaven-fit-*.png, brasshaven-fit.txt, /brasshaven fitcheck), un rendu 3D de chaque biome Brasshaven (brasshaven-biome-*.png, /brasshaven biomeshots), le résumé de chaque test serveur (brasshaven-ci-*.txt, durée des phases, vitesse de génération avec et sans les biomes Brasshaven en ms/chunk et leur rapport, le mod complet face à Forge sans le mod — démarrage, ms et CPU par chunk, mémoire, MSPT, lignes FAIL), les profils Java Flight Recorder de la génération et de la base chargée (brasshaven-ci-profile.txt — méthodes les plus coûteuses, part de com.brasshaven, allocations, pauses GC), et des captures du vrai client (brasshaven-shot-*.png — écrans, HUD, créatures, Citadelle) prises par le job client-test, et les séquences filmées du vrai client pour les vidéos de présentation (brasshaven-showcase-*.mp4 et brasshaven-showcase-scenes.json, job showcase, assemblées par tools/make_video.py) (commit ${{ github.sha }}).
          files: previews/*

  # Development build of a branch: the tested jar and the packs on the branch's pre-release (dev-<branch>)
  release:
    # world-test (generation speed against vanilla) shows red on its own but does not hold back the test jar
    needs: [build, smoke-test, fit-test]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-mod
          path: jar

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-packs
          path: packs

      - name: Publish the jar as the latest development build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.ref_name }}
          name: Brasshaven — build de développement (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Build automatique ${{ needs.build.outputs.version }} du commit ${{ github.sha }}, testé sur un serveur Forge (structures, mobs, objets, butins).
            Mets `brasshaven-*.jar` dans le dossier `mods` d'un profil CurseForge Minecraft 26.2 + Forge 65.1.0 (même jar sur le serveur et chez chaque joueur).
            `brasshaven-server-*.zip` : serveur prêt à lancer (start.sh / start.bat). `brasshaven-modpack-*.zip` : profil à importer dans l'app CurseForge.
            Versions publiques : les releases `v*` (docs/PUBLISHING.md).
          files: |
            jar/brasshaven-*.jar
            packs/*.zip

      # jar names carry the build number: drop the previous builds' files so the release holds only this one
      - name: Remove the previous builds' files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-$GITHUB_REF_NAME"
          keep=$(ls jar packs)
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r asset; do
            case "$asset" in
              brasshaven-*.jar|brasshaven-*.zip)
                if ! printf '%s\n' "$keep" | grep -qxF "$asset"; then
                  gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" -y
                fi ;;
            esac
          done

  # Public release: push a tag v<mod_version> (docs/PUBLISHING.md). After the server tests pass: GitHub release with
  # the changelog (commits since the previous v* tag), the jar, the server pack and the modpack.
  github-release:
    needs: [build, smoke-test, fit-test]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-mod
          path: jar

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-packs
          path: packs

      - name: Changelog (commits since the previous release)
        run: python3 tools/changelog.py --version "${{ needs.build.outputs.version }}" --to "$GITHUB_SHA" --out build/changelog.md

      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: build/changelog.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # pushed tag, or (Run workflow + release) created here on this commit
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Brasshaven ${{ needs.build.outputs.version }}
          body_path: build/changelog.md
          prerelease: false
          make_latest: true
          files: |
            jar/brasshaven-*.jar
            packs/*.zip

  # Optional: skipped until the repository variable CURSEFORGE_PROJECT_ID exists; the upload itself is skipped (with a
  # notice) while the secret CURSEFORGE_TOKEN is missing. Release type from the version (0.9.0-beta: beta).
  curseforge:
    needs: [build, github-release]
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)) && vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-mod
          path: jar

      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: build

      - name: Upload to CurseForge (Minecraft 26.2, Forge, Java 25)
        id: upload
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: python3 tools/publish.py curseforge --jar "$(ls jar/brasshaven-*.jar | head -n 1)" --changelog build/changelog.md

      # the modpack that references the CurseForge file (what a modpack project on CurseForge needs)
      - name: Modpack referencing the CurseForge file
        if: steps.upload.outputs.file_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/make_modpack.py modpack --jar "$(ls jar/brasshaven-*.jar | head -n 1)" --out build/packs \
            --project-id "${{ vars.CURSEFORGE_PROJECT_ID }}" --file-id "${{ steps.upload.outputs.file_id }}"
          gh release upload "v${{ needs.build.outputs.version }}" build/packs/*-curseforge.zip --repo "$GITHUB_REPOSITORY" --clobber

  # Optional, like curseforge: repository variable MODRINTH_PROJECT_ID and secret MODRINTH_TOKEN
  modrinth:
    needs: [build, github-release]
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)) && vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: brasshaven-mod
          path: jar

      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: build

      - name: Upload to Modrinth (Minecraft 26.2, Forge)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: python3 tools/publish.py modrinth --jar "$(ls jar/brasshaven-*.jar | head -n 1)" --changelog build/changelog.md
