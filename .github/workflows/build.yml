name: Build the mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# one build per branch at a time: a new push cancels the running build, so the latest code is always the one tested
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload the jar (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wayfarers-mod
          path: build/libs/wayfarers-*.jar

  # Boots a real Forge server with the jar, places every structure, summons every mob and item,
  # breaks blocks, spawns every loot table and reloads data packs. Fails on any error in the log.
  # the two server tests run side by side on separate machines
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: wayfarers-mod
          path: jar

      - name: Install the Forge server
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-installer.jar
          java -jar installer.jar --installServer server > install.log 2>&1 || (tail -50 install.log; exit 1)
          cp jar/wayfarers-*.jar server/mods/

      - name: Run the smoke test (structures, mobs, items, loot)
        run: python3 tools/ci_smoke.py server

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console*.log

  world-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: wayfarers-mod
          path: jar

      - name: Install the Forge server
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-installer.jar
          java -jar installer.jar --installServer server > install.log 2>&1 || (tail -50 install.log; exit 1)
          cp jar/wayfarers-*.jar server/mods/

      - name: Run the world overhaul test (new world, every biome, world map)
        run: python3 tools/ci_smoke.py server --overhaul

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-test-logs
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console*.log

      - name: Upload the world previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-previews
          if-no-files-found: ignore
          path: |
            server/wayfarers-worldmap*.png
            server/wayfarers-worldmap.txt

  previews:
    # the world map images go to their own pre-release, even when a test failed, so they can be looked at
    needs: world-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: world-previews
          path: previews

      - name: Publish the world previews
        if: hashFiles('previews/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: previews-${{ github.ref_name }}
          name: Wayfarers — aperçus du monde (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: Carte des biomes, biomes souterrains et coupe du relief générés par /wayfarers worldmap (commit ${{ github.sha }}).
          files: previews/*

  release:
    needs: [build, smoke-test, world-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wayfarers-mod
          path: jar

      - name: Publish the jar as the latest development build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.ref_name }}
          name: Wayfarers — build de développement (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Build automatique du commit ${{ github.sha }}, testé sur un serveur Forge (structures, mobs, objets, butins).
            Mets `wayfarers-1.0.0.jar` dans le dossier `mods` d'un profil CurseForge Minecraft 26.2 + Forge 65.1.0.
          files: jar/wayfarers-*.jar
