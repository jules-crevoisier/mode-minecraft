name: Build the mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# one build per branch at a time: a new push cancels the running build, so the latest code is always the one tested
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload the jar (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wayfarers-mod
          path: build/libs/wayfarers-*.jar

  # Boots a real Forge server with the jar, places every structure, summons every mob and item,
  # breaks blocks, spawns every loot table and reloads data packs. Fails on any error in the log.
  # the two server tests run side by side on separate machines
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: wayfarers-mod
          path: jar

      - name: Install the Forge server
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-installer.jar
          java -jar installer.jar --installServer server > install.log 2>&1 || (tail -50 install.log; exit 1)
          cp jar/wayfarers-*.jar server/mods/

      - name: Run the smoke test (structures, mobs, items, loot)
        run: python3 tools/ci_smoke.py server

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console*.log

      # the diagnostic summary (phases, FAIL lines) goes to the previews release
      - name: Upload the test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-previews-smoke
          if-no-files-found: ignore
          path: server/wayfarers-ci-*.txt

  # The structure fit test, in a fresh world with Minecraft's own generator (the mod adds no terrain or biome), in two
  # shards on two machines (every second structure each): /wayfarers fitcheck locates the Overworld structures of the
  # mod, generates them and measures how they sit on the vanilla terrain (floating edges, buried edges, flooding),
  # with a render of each in place. A misfit fails the job. Each shard keeps to ~35 minutes of test.
  fit-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: fit-1
            shard: "0/2"
          - part: fit-2
            shard: "1/2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: wayfarers-mod
          path: jar

      - name: Install the Forge server
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-installer.jar
          java -jar installer.jar --installServer server > install.log 2>&1 || (tail -50 install.log; exit 1)
          cp jar/wayfarers-*.jar server/mods/

      - name: Run the structure fit test (every Overworld structure located, generated and measured in a vanilla world)
        run: python3 tools/ci_smoke.py server --fit --shard ${{ matrix.shard }}

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fit-test-logs-${{ matrix.part }}
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console*.log

      - name: Upload the fit renders and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-previews-${{ matrix.part }}
          if-no-files-found: ignore
          path: |
            server/wayfarers-fit-*.png
            server/wayfarers-fit*.txt
            server/wayfarers-ci-*.txt

  # Runs the real client (software OpenGL under Xvfb) through ForgeGradle's runClient. client/CiDriver creates a
  # world, opens every screen of the mod, places machines, summons creatures and the Clockwork Citadel, and saves a
  # screenshot of each; tools/ci_client.py enforces the timeouts and fails on client-side errors in the log.
  # `release` does not wait for it: the jar still ships while this job beds in.
  client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      MESA_GL_VERSION_OVERRIDE: "4.5"
      MESA_GLSL_VERSION_OVERRIDE: "450"
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb and Mesa (software OpenGL)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri \
            libegl1 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1
          xvfb-run -a -s "-screen 0 1920x1080x24" glxinfo -B || true

      - name: Run the client test (screens, HUD, creatures, Clockwork Citadel)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/ci_client.py

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          if-no-files-found: ignore
          path: build/ci-client/

      - name: Upload the client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-logs
          if-no-files-found: ignore
          path: |
            run/logs/
            run/crash-reports/
            run/hs_err_pid*.log
            run/ci-client-report.txt
            run/ci-client-console.log

  previews:
    # the structure fit renders, the test summaries and the client screenshots go to their own pre-release, even when
    # a test failed, so they can be looked at
    needs: [smoke-test, fit-test, client-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: world-previews-*
          merge-multiple: true
          path: previews

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-screenshots
          path: client

      - name: Collect the client screenshots
        run: |
          mkdir -p previews
          cp client/wayfarers-shot-*.png previews/ 2>/dev/null || echo "no client screenshots"
          cp client/ci-client-summary.md previews/ 2>/dev/null || echo "no client summary"
          # the fit test runs in shards: one report for the release, as before
          if ls previews/wayfarers-fit-shard*.txt >/dev/null 2>&1; then
            cat previews/wayfarers-fit-shard*.txt > previews/wayfarers-fit.txt
          fi
          ls previews/wayfarers-ci-*.txt 2>/dev/null || echo "no test summaries"

      - name: Publish the previews
        if: hashFiles('previews/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: previews-${{ github.ref_name }}
          name: Wayfarers — aperçus (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: Chaque structure en place sur le relief d'un monde vanilla avec sa mesure d'intégration (wayfarers-fit-*.png, wayfarers-fit.txt, /wayfarers fitcheck), le résumé de chaque test serveur (wayfarers-ci-*.txt, durée des phases, lignes FAIL), et des captures du vrai client (wayfarers-shot-*.png — écrans, HUD, créatures, Citadelle) prises par le job client-test (commit ${{ github.sha }}).
          files: previews/*

  release:
    needs: [build, smoke-test, fit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wayfarers-mod
          path: jar

      - name: Publish the jar as the latest development build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.ref_name }}
          name: Wayfarers — build de développement (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Build automatique du commit ${{ github.sha }}, testé sur un serveur Forge (structures, mobs, objets, butins).
            Mets `wayfarers-1.0.0.jar` dans le dossier `mods` d'un profil CurseForge Minecraft 26.2 + Forge 65.1.0.
          files: jar/wayfarers-*.jar
