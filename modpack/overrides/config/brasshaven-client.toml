# Brasshaven recommended brasshaven-client.toml (tools/make_modpack.py configs from the mod's config classes).
# Forge reads it from the config folder; every value is the mod's default unless noted below.

[quests]
	#Quest shown in the on-screen tracker (set from the quest journal).
	tracked = ""
	#Show the tracked quest in the top-right corner of the screen.
	showTracker = true

[hud]
	#Health bars above creatures: ALWAYS, DAMAGED (hurt or targeted) or NEVER.
	#Allowed Values: ALWAYS, DAMAGED, NEVER
	healthBars = "DAMAGED"
	#Health bars and damage numbers are drawn for creatures up to this many blocks away.
	#Lower it to save frames in crowded places (mob farms, big fights).
	#Range: 4 ~ 64
	healthBarRange = 24
	#Floating damage numbers when you hit a creature.
	damageNumbers = true
	#One-time tips that explain a system the first time you meet it.
	tips = true

[map]
	#Show the minimap (toggle in game with H; Shift + H changes its size).
	minimap = true
	#Screen corner of the minimap: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT or BOTTOM_RIGHT.
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT
	corner = "TOP_LEFT"
	#Minimap size on screen, frame included: SMALL (56 px), MEDIUM (68 px), LARGE (96 px) or XLARGE (128 px).
	#Cycle it in game with Shift + H, or in the mod's settings (Mods > Brasshaven > Config).
	#Allowed Values: SMALL, MEDIUM, LARGE, XLARGE
	size = "MEDIUM"
	#Exact minimap size on screen in GUI pixels, frame included, from 48 to 160 (0: the map.size preset).
	#Set it in game with the size slider of the world map's options (M, then the gear button).
	#Range: 0 ~ 160
	sizePixels = 0
	#Minimap shape: ROUND (brass porthole) or SQUARE.
	#Allowed Values: ROUND, SQUARE
	shape = "ROUND"
	#Turn the minimap with you (your facing is always up). Off: north is always up.
	rotate = false
	#Minimap zoom level, 0 (widest) to 3 (closest). Cycle it in game with Z.
	#Range: 0 ~ 3
	zoom = 1
	#Show your coordinates and the biome under the minimap.
	showCoordinates = true
	#Opacity of the minimap's terrain, in percent (lower it to see the world through the map).
	#Range: 30 ~ 100
	opacity = 100
	#Relief on the maps, shaded from the explored heights (light from the north-west, darker valleys):
	#FLAT (plain colours), NORMAL or STRONG.
	#Allowed Values: FLAT, NORMAL, STRONG
	relief = "NORMAL"
	#Thin contour lines every 16 blocks of height on the maps (a bolder one every 64).
	contours = false
	#The world map opens in its tilted 3D view (relief raised from the explored heights) instead of seen from above.
	worldMap3d = false
	#Underground, map the cave around you (a slice at your height) instead of the surface far above.
	caveMode = true
	#Show other players on the maps: the ones the server shares (its own map.showPlayers) and those near enough
	#for your client to see them. Their head, and on the minimap an arrow on its edge for those further away.
	showPlayers = true
	#Entity radar: creatures around you as small icons on the minimap (and on the world map zoomed in near you).
	#Client side only: it shows what your game already knows, nothing more is sent by the server.
	radar = true
	#Radar icons: HEADS (the creature's face when it is known, else a dot) or DOTS (coloured by kind).
	#Allowed Values: HEADS, DOTS
	radarIcons = "HEADS"
	#Radar: hostile creatures (red). Bosses always show while the radar is on.
	radarHostile = true
	#Radar: animals (green) and neutral creatures (yellow, red once angry).
	radarPassive = true
	#Radar: villagers, wandering traders and the mod's NPCs.
	radarNpcs = true
	#Radar: items lying on the ground (small grey dots).
	radarItems = false

[updates]
	#Look for a newer Brasshaven release (GitHub, in the background) and show a notice with the changelog link.
	#Nothing is ever downloaded.
	checkForUpdates = true
